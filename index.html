<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kolam Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b120d; --bg-panel: #241a13; --bg-panel-2: #2c2018;
    --text: #f2e8d8; --text-dim: #c9b79c; --border: #3c2c1f; --gold: #d9a62e;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b120d; } }
  :root[data-theme="dark"] { --bg: #1b120d; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 0%, #251a12 0%, var(--bg) 60%);
    color: var(--text); font-family: 'Karla', sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header { padding: 1.1rem 1rem 0.3rem; text-align: center; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 0.7rem; }
  .tabs { display: flex; gap: 0.45rem; justify-content: center; flex-wrap: wrap; }
  .tab {
    font-family: 'Karla', sans-serif; font-size: 0.85rem; font-weight: 600;
    padding: 0.55rem 0.85rem; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-panel-2); color: var(--text-dim); cursor: pointer;
  }
  .tab.active { background: var(--gold); color: #241a13; border-color: var(--gold); }
  main {
    flex: 1; display: flex; flex-wrap: wrap; gap: 1.2rem;
    padding: 0.9rem 1.2rem 1rem; align-items: flex-start; justify-content: center;
  }
  .canvas-wrap {
    flex: 1 1 420px; max-width: 640px; background: var(--floor, #6b2b23);
    border-radius: 10px; padding: clamp(0.8rem, 4vw, 2rem);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35), 0 8px 30px rgba(0,0,0,0.4);
    border: 1px solid var(--border);
  }
  .canvas-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .panel {
    flex: 0 1 280px; background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.1rem 1.2rem 1.3rem;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .field label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 0.35rem; }
  .field label b { color: var(--text); font-weight: 500; }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  select {
    width: 100%; background: var(--bg-panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.6rem;
    font-family: 'Karla', sans-serif; font-size: 0.9rem;
  }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; color: var(--text-dim); }
  .toggle-row input { accent-color: var(--gold); width: 18px; height: 18px; }
  .btn-row { display: flex; gap: 0.6rem; }
  button.action {
    flex: 1; font-family: 'Karla', sans-serif; font-size: 0.88rem; font-weight: 600;
    padding: 0.65rem 0.7rem; border-radius: 7px; border: 1px solid var(--border);
    cursor: pointer; background: var(--bg-panel-2); color: var(--text); transition: background 0.15s ease;
  }
  button.action:hover { background: #3a2a1c; }
  button.primary { background: var(--gold); color: #241a13; border-color: var(--gold); }
  button.primary:hover { background: #e6b53f; }
  .kolam-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .seq { font-size: 0.72rem; color: var(--text-dim); word-break: break-word; }
  .mode-block { display: none; flex-direction: column; gap: 1rem; }
  .mode-block.active { display: flex; }
  footer {
    text-align: center; padding: 0.8rem 1rem 1.2rem; font-size: 0.78rem; color: var(--text-dim);
  }
  footer a { color: var(--gold); text-decoration: underline; text-underline-offset: 2px; }
  @media (max-width: 640px) {
    main { flex-direction: column; padding: 0.6rem 0.8rem 0.8rem; }
    .panel { flex: 1 1 auto; width: 100%; }
    .canvas-wrap { width: 100%; }
    .tab { font-size: 0.8rem; padding: 0.5rem 0.7rem; }
  }
</style>
</head>
<body>
<header>
  <h1>Kolam Generator</h1>
  <div class="tabs">
    <button class="tab active" data-mode="sikku">Sikku Kolam</button>
    <button class="tab" data-mode="hridaya">Hridaya Kolam</button>
  </div>
</header>

<main>
  <div class="canvas-wrap" id="canvasWrap"></div>

  <div class="panel">
    <!-- Sikku controls -->
    <div class="mode-block active" id="mode-grid">
      <div class="field">
        <label>Dot layout</label>
        <select id="layoutSelect">
          <option value="square">Square</option>
          <option value="diamond">Diamond</option>
          <option value="ascending">Ascending</option>
          <option value="descending">Descending</option>
          <option value="cross">Cross</option>
        </select>
      </div>
      <div class="field">
        <label>Size <b id="sizeVal">8</b></label>
        <input type="range" id="sizeInput" min="3" max="17" step="1" value="8">
      </div>
      <div class="btn-row"><button class="action primary" id="newPattern">New pattern</button></div>
    </div>

    <!-- Hridaya controls -->
    <div class="mode-block" id="mode-hridaya">
      <div class="field">
        <label>Dots per arm (m) <b id="mVal">7</b></label>
        <input type="range" id="mInput" min="2" max="14" step="1" value="7">
      </div>
      <div class="field">
        <label>Arms (n, coprime to m)</label>
        <select id="nSelect"></select>
      </div>
      <div class="field">
        <label>Connection style</label>
        <select id="hridayaStyle">
          <option value="out">Bulging outward (traditional)</option>
          <option value="straight">Straight lines</option>
          <option value="in">Bulging inward</option>
        </select>
      </div>
      <div class="seq" id="seqDisplay"></div>
    </div>

    <div class="toggle-row">
      <span>Draw-on animation</span>
      <input type="checkbox" id="animate" checked>
    </div>
    <div class="btn-row"><button class="action" id="downloadBtn">Download image</button></div>
  </div>
</main>

<footer id="creditFooter"></footer>

<script>
const SW = 7; // fixed line weight
const THEME_EARTH = { floor: '#6b2b23', line: '#f4e9d8', dot: '#e8c78f' };   // Sikku
const THEME_PEACOCK = { floor: '#132623', line: '#2fb3a0', dot: '#e8d27a' }; // Hridaya
const CONTROLS_FOR = { sikku: 'grid', hridaya: 'hridaya' };
const DOT_R = Math.max(2, SW * 0.4);
const KEYFRAMES = '<style>@keyframes draw { to { stroke-dashoffset: 0; } }</style>';

let mode = 'sikku';
const wrap = document.getElementById('canvasWrap');
const animateChk = document.getElementById('animate');

function animAttrs() {
  return animateChk.checked
    ? 'pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation: draw 2.6s ease forwards;"'
    : '';
}

/* ---------- Sikku Kolam ---------- */
// Dots sit on a square grid. A "layout" decides which grid points exist
// (square, diamond, ascending, descending, cross). Every existing dot gets a
// closed loop; each edge between two existing neighbours gets one shared
// random on/off bit. Where it is on, both loops grow a tip that meets at the
// edge. Bits are mirrored left-right (and top-bottom when the layout allows).
const DENSITY = 0.66;
let bits = null, bitsKey = null;

const layoutSelect = document.getElementById('layoutSelect');
const sizeInput = document.getElementById('sizeInput');
const sizeVal = document.getElementById('sizeVal');

// n = dots in the widest row (or the side of a square)
function makeLayout(kind, n) {
  const needsOdd = kind === 'diamond' || kind === 'ascending' || kind === 'descending';
  if (needsOdd && n % 2 === 0) n += 1;
  const c = (n - 1) / 2;
  let C = n, R = n, tb = true, inMask;
  if (kind === 'square') inMask = () => true;
  else if (kind === 'diamond') inMask = (i, j) => Math.abs(i - c) + Math.abs(j - c) <= c;
  else if (kind === 'ascending') { R = (n + 1) / 2; tb = false; inMask = (i, j) => Math.abs(i - c) <= j; }
  else if (kind === 'descending') { R = (n + 1) / 2; tb = false; inMask = (i, j) => Math.abs(i - c) <= (R - 1 - j); }
  else inMask = (i, j) => Math.abs(i - c) <= 1 || Math.abs(j - c) <= 1; // cross
  const mask = Array.from({ length: C }, (_, i) => Array.from({ length: R }, (_, j) => inMask(i, j)));
  return { kind, n, C, R, tb, mask };
}

function generateBits(L, density) {
  const { C, R, tb, mask } = L;
  const memo = new Map();
  const pick = keys => {
    const key = keys.slice().sort()[0];
    if (!memo.has(key)) memo.set(key, Math.random() < density ? 1 : 0);
    return memo.get(key);
  };
  const EW = Array.from({ length: Math.max(C - 1, 0) }, () => new Array(R).fill(0));
  const NS = Array.from({ length: C }, () => new Array(Math.max(R - 1, 0)).fill(0));
  for (let i = 0; i < C - 1; i++)
    for (let j = 0; j < R; j++) {
      if (!mask[i][j] || !mask[i + 1][j]) continue;
      const ks = [`h${i},${j}`, `h${C - 2 - i},${j}`];
      if (tb) ks.push(`h${i},${R - 1 - j}`, `h${C - 2 - i},${R - 1 - j}`);
      EW[i][j] = pick(ks);
    }
  for (let i = 0; i < C; i++)
    for (let j = 0; j < R - 1; j++) {
      if (!mask[i][j] || !mask[i][j + 1]) continue;
      const ks = [`v${i},${j}`, `v${C - 1 - i},${j}`];
      if (tb) ks.push(`v${i},${R - 2 - j}`, `v${C - 1 - i},${R - 2 - j}`);
      NS[i][j] = pick(ks);
    }
  return { EW, NS };
}

function renderSikku() {
  const kind = layoutSelect.value;
  const L = makeLayout(kind, parseInt(sizeInput.value, 10));
  if (String(L.n) !== sizeInput.value) sizeInput.value = L.n;
  sizeVal.textContent = L.n;
  const key = kind + ':' + L.n;
  if (!bits || bitsKey !== key) { bits = generateBits(L, DENSITY); bitsKey = key; }
  const { EW, NS } = bits;
  const { C, R, mask } = L;

  let minI = C, maxI = -1, minJ = R, maxJ = -1;
  for (let i = 0; i < C; i++) for (let j = 0; j < R; j++) if (mask[i][j]) {
    minI = Math.min(minI, i); maxI = Math.max(maxI, i);
    minJ = Math.min(minJ, j); maxJ = Math.max(maxJ, j);
  }
  const cs = 56, pad = 30;
  const w = (maxI - minI + 1) * cs + pad * 2, h = (maxJ - minJ + 1) * cs + pad * 2;
  const ox = pad - minI * cs, oy = pad - minJ * cs;
  wrap.style.setProperty('--floor', THEME_EARTH.floor);
  const r0 = cs * 0.25, tipR = cs * 0.5, K = 0.42;
  const U = [[0, -1], [1, 0], [0, 1], [-1, 0]];   // N E S W outward
  const V = [[1, 0], [0, 1], [-1, 0], [0, -1]];   // clockwise tangents
  const norm = (x, y) => { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; };

  const paths = [], dots = [];
  for (let i = 0; i < C; i++) {
    for (let j = 0; j < R; j++) {
      if (!mask[i][j]) continue;
      const conn = [
        j > 0 ? NS[i][j - 1] : 0,
        i < C - 1 ? EW[i][j] : 0,
        j < R - 1 ? NS[i][j] : 0,
        i > 0 ? EW[i - 1][j] : 0
      ];
      const cx = ox + i * cs + cs / 2, cy = oy + j * cs + cs / 2;
      dots.push(`<circle cx="${cx}" cy="${cy}" r="${DOT_R}" fill="${THEME_EARTH.dot}"/>`);
      const P = U.map((u, k) => {
        const rad = conn[k] ? tipR : r0;
        return [cx + u[0] * rad, cy + u[1] * rad];
      });
      const tin = [], tout = [];
      for (let k = 0; k < 4; k++) {
        if (conn[k]) {
          const prev = P[(k + 3) % 4], next = P[(k + 1) % 4];
          tin.push(norm(P[k][0] - prev[0], P[k][1] - prev[1]));
          tout.push(norm(next[0] - P[k][0], next[1] - P[k][1]));
        } else { tin.push(V[k]); tout.push(V[k]); }
      }
      let d = `M ${P[0][0]},${P[0][1]} `;
      for (let k = 0; k < 4; k++) {
        const a = P[k], b = P[(k + 1) % 4];
        const Ln = Math.hypot(b[0] - a[0], b[1] - a[1]);
        const bt = tin[(k + 1) % 4];
        d += `C ${a[0] + tout[k][0] * K * Ln},${a[1] + tout[k][1] * K * Ln} ` +
             `${b[0] - bt[0] * K * Ln},${b[1] - bt[1] * K * Ln} ${b[0]},${b[1]} `;
      }
      d += 'Z';
      paths.push(`<path class="kolam-line" d="${d}" stroke="${THEME_EARTH.line}" stroke-width="${SW}" ${animAttrs()}/>`);
    }
  }
  wrap.innerHTML = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${KEYFRAMES}${paths.join('')}${dots.join('')}</svg>`;
}

/* ---------- Hridaya ---------- */
const mInput = document.getElementById('mInput');
const mVal = document.getElementById('mVal');
const nSelect = document.getElementById('nSelect');
const hridayaStyle = document.getElementById('hridayaStyle');
const seqDisplay = document.getElementById('seqDisplay');

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

function buildHridayaSequence(m, n) {
  const S = [];
  for (let k = 0; k < m; k++) S.push(k === 0 ? m : (k * n) % m);
  let ext = [];
  for (let rep = 0; rep < n; rep++) ext = ext.concat(S);
  return { base: S, extended: ext };
}

function populateNOptions() {
  const m = parseInt(mInput.value, 10);
  const prev = nSelect.value ? parseInt(nSelect.value, 10) : null;
  nSelect.innerHTML = '';
  const options = [];
  for (let n = 3; n <= 15; n++) if (n !== m && gcd(m, n) === 1) options.push(n);
  options.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    nSelect.appendChild(opt);
  });
  if (prev && options.includes(prev)) nSelect.value = prev;
  else if (options.includes(8)) nSelect.value = 8;
  else nSelect.value = options[Math.min(1, options.length - 1)];
}

function renderHridaya() {
  const m = parseInt(mInput.value, 10);
  mVal.textContent = m;
  populateNOptions();
  const n = parseInt(nSelect.value, 10);
  const { base, extended } = buildHridayaSequence(m, n);

  const ringSpacing = 26, margin = 34;
  const size = m * ringSpacing * 2 + margin * 2;
  const cx = size / 2, cy = size / 2;
  const dTheta = (2 * Math.PI) / n;
  const angleOffset = -Math.PI / 2;
  wrap.style.setProperty('--floor', THEME_PEACOCK.floor);

  const toXY = (r, i) => {
    const theta = angleOffset + (i % n) * dTheta;
    const rad = r * ringSpacing;
    return [cx + rad * Math.cos(theta), cy + rad * Math.sin(theta)];
  };
  const pts = extended.map((r, i) => toXY(r, i));
  pts.push(pts[0]);

  const style = hridayaStyle.value;
  const bulge = style === 'out' ? 1 : style === 'in' ? -1 : 0;
  let d = `M ${pts[0][0]},${pts[0][1]} `;
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
    if (bulge === 0) { d += `L ${bx},${by} `; continue; }
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const vx = mx - cx, vy = my - cy;
    const len = Math.hypot(vx, vy) || 1;
    const chord = Math.hypot(bx - ax, by - ay);
    const avgR = (Math.hypot(ax - cx, ay - cy) + Math.hypot(bx - cx, by - cy)) / 2;
    const angCoef = 0.5 * (dTheta / (Math.PI / 4));
    const push = Math.min(chord * 0.62, avgR * angCoef) * bulge;
    d += `Q ${mx + (vx / len) * push},${my + (vy / len) * push} ${bx},${by} `;
  }

  let dots = '';
  for (let arm = 0; arm < n; arm++)
    for (let ring = 1; ring <= m; ring++) {
      const [x, y] = toXY(ring, arm);
      dots += `<circle cx="${x}" cy="${y}" r="${DOT_R}" fill="${THEME_PEACOCK.dot}"/>`;
    }

  wrap.innerHTML = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${KEYFRAMES}` +
    `<path class="kolam-line" d="${d}" stroke="${THEME_PEACOCK.line}" stroke-width="${SW}" ${animAttrs()}/>${dots}</svg>`;
  seqDisplay.textContent = `m=${m}, n=${n} — base sequence: ${base.join(' → ')} → ${base[0]}`;
}

/* ---------- Menu & wiring ---------- */
const CREDITS = {
  sikku: 'Inspired by <a href="https://github.com/Crazzygamerr/zen-kolam" target="_blank" rel="noopener">zen-kolam</a>',
  hridaya: 'Algorithm: Chakraborty &amp; Manna, <a href="https://arxiv.org/abs/2507.02874" target="_blank" rel="noopener">arXiv:2507.02874</a>'
};
function updateCredit() {
  document.getElementById('creditFooter').innerHTML = CREDITS[mode];
}

function render() {
  updateCredit();
  if (mode === 'sikku') renderSikku();
  else renderHridaya();
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.mode-block').forEach(b => b.classList.remove('active'));
    document.getElementById('mode-' + CONTROLS_FOR[mode]).classList.add('active');
    render();
  });
});

sizeInput.addEventListener('input', render);
layoutSelect.addEventListener('change', render);
document.getElementById('newPattern').addEventListener('click', () => {
  bitsKey = null;
  render();
});
mInput.addEventListener('input', render);
nSelect.addEventListener('change', render);
hridayaStyle.addEventListener('change', render);
animateChk.addEventListener('input', render);

// Build a self-contained copy of the drawing for saving: inline styles,
// no animation state, and a background so it looks right in any viewer.
function buildExportSvg() {
  const svgEl = wrap.querySelector('svg');
  if (!svgEl) return null;
  const clone = svgEl.cloneNode(true);
  clone.querySelectorAll('style').forEach(s => s.remove());
  clone.querySelectorAll('path').forEach(p => {
    ['pathLength', 'stroke-dasharray', 'stroke-dashoffset', 'style', 'class'].forEach(a => p.removeAttribute(a));
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
  });
  const vb = svgEl.getAttribute('viewBox').split(' ').map(Number);
  const m = 24; // margin around the drawing
  const x = vb[0] - m, y = vb[1] - m, w = vb[2] + 2 * m, h = vb[3] + 2 * m;
  clone.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', w);
  clone.setAttribute('height', h);
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('x', x); bg.setAttribute('y', y);
  bg.setAttribute('width', w); bg.setAttribute('height', h);
  bg.setAttribute('fill', wrap.style.getPropertyValue('--floor'));
  clone.insertBefore(bg, clone.firstChild);
  return { svg: new XMLSerializer().serializeToString(clone), w, h };
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  const out = buildExportSvg();
  if (!out) return;
  const name = (mode === 'sikku' ? 'sikku-' + layoutSelect.value : mode) + '-kolam.png';
  const img = new Image();
  img.onload = () => {
    const scale = 1600 / out.w;
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(out.w * scale);
    canvas.height = Math.round(out.h * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out.svg);
});

populateNOptions();
render();
</script>
</body>
</html>
